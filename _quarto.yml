        <script>
        window.MathJax = {
          tex: {
            macros: {
              esp:    ["\\mathbb{E}\\!\\left[#1\\right]", 1],
              Esp:    ["\\mathbb{E}\\!\\left[#1\\right]", 1],
              ex:     "\\mathbb{E}",
              var:    ["\\mathrm{Var}\\!\\left(#1\\right)", 1],
              Var:    ["\\mathrm{Var}\\!\\left(#1\\right)", 1],
              vr:     "\\mathrm{Var}",
              prob:   "\\Pr",
              Prob:   "\\Pr",
              Cov:    "\\mathrm{Cov}",
              d:      "\\mathrm{d}",
              bm:     ["\\boldsymbol{#1}", 1]
            }
          }
        };
        </script>
